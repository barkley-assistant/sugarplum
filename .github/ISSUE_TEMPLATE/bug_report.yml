name: Bug report
description: Something is broken or behaving unexpectedly
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill in what you can — a good bug report gets fixed faster.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's wrong, in one or two sentences.
      placeholder: "e.g. An Amazon URL never shows a price or image."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, step by step.
      placeholder: |
        1. Log in as ...
        2. Paste URL ...
        3. See ...
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Device, browser, screen size, anything relevant (e.g. Android Chrome, 390px).
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true