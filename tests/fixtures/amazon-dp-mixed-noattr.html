<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>Amazon Basics Stainless Steel Kitchen Organiser</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <!-- Hand-trimmed Amazon DP page for a MIXED item served in shape B (ASIN
       B0FPXD23ST, captured 2026-09-24). Faithful to the real served markup:
       NO og:/twitter: metas, NO JSON-LD, NO microdata.

       Shape B: exactly ONE div[id^=corePrice] (£13.00 — the featured buybox
       offer, shown with the discount badge on the live page) and NO
       data-csa-c-buying-option-type anywhere in the document. The only
       condition evidence is the ingress link: href condition=ALL and its
       .a-offscreen is the £12.52 all-conditions floor.

       Trap: reading the ingress first (today's behaviour) returns 1252. The
       honest answer is the featured offer, 1300 — the page declares no
       condition, so there is no NEW marker to filter on and the featured
       offer is the best available evidence.

       A trailing sponsored carousel (£21.99, another ASIN) guards the end-tag
       disarm. -->
  <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice" data-csa-c-asin="B0FPXD23ST">
    <div class="a-section apex-core-price-identifier">
      <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
        <span class="a-offscreen">£13.00</span>
        <span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">13<span class="a-price-decimal">.</span></span><span class="a-price-fraction">00</span></span>
      </span>
      <span class="a-size-small a-color-price">£13.00 with 28 percent savings -28% RRP: £17.99</span>
    </div>
  </div>

  <!-- All-offers ingress ("New & Used (28) from £12.52") — the ALL-conditions
       floor, and on this shape the ONLY condition evidence on the page. -->
  <div class="a-section a-spacing-none daodi-content">
    <span class="a-declarative" data-action="show-all-offers-display" data-show-all-offers-display="{}">
      <a id="aod-ingress-link" aria-expanded="false" class="a-link-normal" href="/gp/offer-listing/B0FPXD23ST/ref=dp_olp_ALL_mbc?ie=UTF8&amp;condition=ALL" role="button">
        <span class="a-color-base">New &amp; Used (28) from</span>
        <span class="a-price" data-a-size="base_plus" data-a-color="base"><span class="a-offscreen">£12.52</span><span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">12<span class="a-price-decimal">.</span></span><span class="a-price-fraction">52</span></span></span>
      </a>
    </span>
  </div>

  <!-- Main gallery image: data-old-hires carries the SL1500 hi-res variant. -->
  <div id="imageBlock" class="a-section">
    <img alt="Amazon Basics Stainless Steel Kitchen Organiser" src="https://m.media-amazon.com/images/I/71Xk0WlRkTL._AC_SY300_SX300_QL70_ML2_.jpg" data-mb-pv-slot-index="0" data-old-hires="https://m.media-amazon.com/images/I/71Xk0WlRkTL._AC_SL1500_.jpg" data-a-image-name="landingImage" class="a-dynamic-image media-block-image-tag" id="landingImage" data-a-dynamic-image="{&quot;https://m.media-amazon.com/images/I/71Xk0WlRkTL._AC_SY355_.jpg&quot;:[355,355],&quot;https://m.media-amazon.com/images/I/71Xk0WlRkTL._AC_SY450_.jpg&quot;:[450,450]}" fetchpriority="high"/>
  </div>

  <!-- Trailing sponsored carousel (other ASIN) BELOW the buybox blocks: the
       buybox capture must already be closed by then. -->
  <div id="sp_detail" class="celwidget" data-csa-c-asin="B0OTHER012">
    <div class="a-row a-color-price">
      <a class="a-link-normal a-text-normal" href="/sspa/click?url=%2Fdp%2FB0OTHER012"><span class="a-price" data-a-size="medium_plus"><span class="a-offscreen">£21.99</span></span></a>
    </div>
  </div>
</body>
</html>
