<body>
  <!-- Hand-trimmed Amazon DP page for an item WITH a featured offer (ASIN
       B0DLGMVR4C, captured 2026-09-15). Shapes below mirror the real served
       markup: NO og:/twitter: metas, NO JSON-LD, NO microdata — Amazon ships
       none of them (see docs/research/product-scraping.md).

       The recommendation carousel comes FIRST in the document on purpose:
       its .a-price spans belong to OTHER ASINs, so an extractor that takes
       the first .a-price on the page returns £24.88 instead of the main
       ASIN's £19.00. Tier 2 must stay anchored to the id-scoped blocks
       below, never to a bare .a-price.

       There is also a sponsored carousel AFTER the buybox blocks (£21.99,
       another ASIN) and a favicon link in <head> — both are traps: the
       buybox capture must be closed by its end tag, and a real gallery image
       must beat the favicon. -->
  <div id="anonCarousel" class="a-carousel-container">
    <a class="a-link-normal a-text-normal" href="/dp/B0OTHER001" role="link">
      <span class='a-price' data-a-size='m'><span class='a-offscreen'>£24.88</span></span>
    </a>
    <a class="a-link-normal a-text-normal" href="/dp/B0OTHER002" role="link">
      <span class="a-price" data-a-size="m"><span class="a-offscreen">£29.99</span></span>
    </a>
  </div>

  <!-- Apex/core price block for the MAIN asin (id prefix: corePrice). -->
  <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice" data-csa-c-asin="B0DLGMVR4C">
    <div class="a-section apex-core-price-identifier">
      <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
        <span class="a-offscreen">£19.00</span>
        <span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">19<span class="a-price-decimal">.</span></span><span class="a-price-fraction">00</span></span>
      </span>
    </div>
  </div>

  <!-- All-offers ingress ("New (19) from £19.00") — the offer FLOOR for the
       main ASIN. Preferred over corePrice* by the extractor. -->
  <div class="a-section a-spacing-none daodi-content">
    <span class="a-declarative" data-action="show-all-offers-display" data-show-all-offers-display="{}">
      <a id="aod-ingress-link" aria-expanded="false" class="a-link-normal" href="/gp/offer-listing/B0DLGMVR4C/ref=dp_olp_NEW_mbc?ie=UTF8&amp;condition=NEW" role="button">
        <span class="a-color-base">New (19) from</span>
        <span class="a-price" data-a-size="base_plus" data-a-color="base"><span class="a-offscreen">£19.00</span><span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">19<span class="a-price-decimal">.</span></span><span class="a-price-fraction">00</span></span></span>
      </a>
    </span>
  </div>

  <!-- Main gallery image: data-old-hires carries the SL1500 hi-res variant. -->
  <div id="imageBlock" class="a-section">
    <img alt="Playmobil Pirates Danger from Giant Shark | Pirate Toys | 71793" src="https://m.media-amazon.com/images/I/81I0WIRzQ9L._AC_SY300_SX300_QL70_ML2_.jpg" data-mb-pv-slot-index="0" data-old-hires="https://m.media-amazon.com/images/I/81I0WIRzQ9L._AC_SL1500_.jpg" data-a-image-name="landingImage" class="a-dynamic-image media-block-image-tag" id="landingImage" data-a-dynamic-image="{&quot;https://m.media-amazon.com/images/I/81I0WIRzQ9L._AC_SY355_.jpg&quot;:[355,284],&quot;https://m.media-amazon.com/images/I/81I0WIRzQ9L._AC_SY450_.jpg&quot;:[450,360]}" fetchpriority="high"/>
  </div>

  <!-- Trailing sponsored carousel (other ASIN) BELOW the buybox blocks: the
       buybox capture must already be closed by then. -->

    <div class="a-row a-color-price">
