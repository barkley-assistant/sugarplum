  https://www.next.co.uk/style/su956648/w13137; a plain fetch is answered
  with an AkamaiGHost 403 "Access Denied", 399 bytes — the existing
  escalation chain covers it, no transport change is needed here).

  WHAT THIS FIXTURE PINS (issue #170)
  -----------------------------------
  The page's JSON-LD is ONE block whose root is a BARE ARRAY of 15 nodes:
    [0] a ProductGroup — name, @id, productGroupID, brand, image, description,
        variesBy, and NO `offers` and NO `hasVariant`.
    [1..14] fourteen Product nodes, one per size, each carrying its own
        `offers` object (price "15".."20", priceCurrency "GBP",
        NewCondition) and linked back to the group with
        `isVariantOf: { "@id": "<page url>", "@type": "ProductGroup" }`.

  The variants are SIBLINGS of the group, NOT nested under `hasVariant`
  (verified on the capture: the group node's keys are exactly
  @context,@type,@id,productGroupID,brand,name,image,description,variesBy).

  Measured price ladder (size 3..16 Yrs, GBP):
    15, 15, 15, 15, 16, 16, 16, 16, 18, 18, 20, 20, 20, 20
  Page display: "£15 - £20" in `data-testid="product-now-price"`.
  So the lowest variant price — the "starting price" — is 1500.

  Sanitisation: the product path, sku codes, description and image URL are
  synthetic; the size list, price ladder, currency and the JSON-LD key shapes
  are as captured. Only the block the extractor reads is kept.

  Also carried, because the live page has them and they must NOT become the
  price source: og:title and <title> (identical, both the store-scraped
  "Buy <name> from the Next UK online shop" form) and NO og:price:* /
  product:price:* / itemprop anywhere in the document.
-->
