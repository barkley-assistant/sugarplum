<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>De'Longhi Dedica Style Espresso Machine</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <!-- Hand-trimmed Amazon DP page for a USED-ONLY item. NOTE: this shape was
       NOT observed in the live 2026-09-24 sample (no used-only ASIN turned up)
       — it asserts the intended contract, not a measured page. The condition
       wrapper and the ingress are both modelled on the measured accordion
       shape (see amazon-dp-mixed-accordion.html).

       ONE div[id^=corePrice] whose nearest enclosing
       div[data-csa-c-buying-option-type] is USED (£14.50). The ingress link
       carries a NEW-flavoured href, but a declared non-new block is proof
       that this page has no new offer, so the ingress must NOT be used.

       Honest answer: null — the direct price stays unavailable while the item
       itself remains usable (the enrichment worker keeps it 'complete' and
       consults the labelled searcher hint instead). -->
  <div id="buyBoxAccordion" class="a-accordion">
    <div id="usedAccordionRow" data-csa-c-buying-option-type="USED" data-csa-c-slot-id="usedAccordionRow" data-csa-c-content-id="corePrice" data-csa-c-is-in-initial-active-row="true">
      <div class="a-section">
        <span class="a-size-small">Used: Like New</span>
      </div>
      <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice" data-csa-c-asin="B0C1USEDON">
        <div class="a-section apex-core-price-identifier">
          <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
            <span class="a-offscreen">£14.50</span>
            <span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">14<span class="a-price-decimal">.</span></span><span class="a-price-fraction">50</span></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="a-section a-spacing-none daodi-content">
    <span class="a-declarative" data-action="show-all-offers-display" data-show-all-offers-display="{}">
      <a id="aod-ingress-link" aria-expanded="false" class="a-link-normal" href="/gp/offer-listing/B0C1USEDON/ref=dp_olp_NEW_mbc?ie=UTF8&amp;condition=NEW" role="button">
        <span class="a-color-base">Used (3) from</span>
        <span class="a-price" data-a-size="base_plus" data-a-color="base"><span class="a-offscreen">£14.50</span><span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">14<span class="a-price-decimal">.</span></span><span class="a-price-fraction">50</span></span></span>
      </a>
    </span>
  </div>

  <div id="imageBlock" class="a-section">
    <img alt="De'Longhi Dedica Style Espresso Machine" src="https://m.media-amazon.com/images/I/61Rk4Wk1PCL._AC_SY300_SX300_QL70_ML2_.jpg" data-mb-pv-slot-index="0" data-old-hires="https://m.media-amazon.com/images/I/61Rk4Wk1PCL._AC_SL1500_.jpg" data-a-image-name="landingImage" class="a-dynamic-image media-block-image-tag" id="landingImage" data-a-dynamic-image="{&quot;https://m.media-amazon.com/images/I/61Rk4Wk1PCL._AC_SY355_.jpg&quot;:[355,355],&quot;https://m.media-amazon.com/images/I/61Rk4Wk1PCL._AC_SY450_.jpg&quot;:[450,450]}" fetchpriority="high"/>
  </div>

  <!-- Trailing sponsored carousel (other ASIN) BELOW the buybox blocks. -->
  <div id="sp_detail" class="celwidget" data-csa-c-asin="B0OTHER013">
    <div class="a-row a-color-price">
      <a class="a-link-normal a-text-normal" href="/sspa/click?url=%2Fdp%2FB0OTHER013"><span class="a-price" data-a-size="medium_plus"><span class="a-offscreen">£21.99</span></span></a>
    </div>
  </div>
</body>
</html>
