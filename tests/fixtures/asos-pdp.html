<!--
  ASOS product page — hand-trimmed from a real capture (2026-09-27, HTTP 200,
  ~505 KB) taken through the project's own stealth transport
  (`scripts/stealth-fetch.py`; a plain fetch is killed at the connection level
  — see docs/research/product-scraping.md §2026-09-27). Sanitised for a public
  repo: no cookies, no basket/session state, and the per-session
  `keyStoreDataversion` query value is redacted.

  WHAT THIS FIXTURE PINS (issue #171)
  -----------------------------------
  The real page carries NO price in any structured or rendered form: no
  `og:price:amount`, no `product:price:amount`, no `itemprop`, and its single
  JSON-LD `Product` node ships an EMPTY offer (`"offers":{}`). The price exists
  only inside `window.asos.pdp.config.stockPriceResponse`, a single-quoted JS
  string holding a JSON ARRAY. Measured on the capture: 39 occurrences of
  `£110.00` on the page, every one of them inside that string.

  THE TRAP BAKED IN HERE
  ----------------------
  The array mixes the page product with the "You Might Also Like" carousel, and
  it is NOT in request order: the sibling `stockPriceApiUrl` request lists
  `productIds=206025763,…` (page product FIRST) while the response puts
  `205104757` first (ascending by productId). Entry [0] here is a DIFFERENT
  PRODUCT — productId 205104757 at £29.99 — and the page product
  (206025763, "Dr Martens ZebZag mule in black suede") is entry [1] at £110.00.
  A first-entry-wins implementation therefore stores £29.99 for a £110.00 page;
  the extractor must anchor on the page's own product id (the JSON-LD
  `productID`, else `/prd/<id>` in the URL) before it reads anything.

  Also carried, so the anchored capture proves it does NOT fire on them: the
  `stockPriceApiUrl` and `stockPriceApiTimeout` sibling assignments (the real
  page has 4 script chunks containing the `stockPriceResponse` substring, of
  which exactly one is the assignment) and the `/*~stockPrice~*/` comment
  prefix ASOS really ships.

  Deviation from the live capture, called out honestly: the live breadcrumb
  block is malformed (`"@context":"https://***@type":"BreadcrumbList"` — the
  `@type` key is swallowed by the context value), so it never reaches
  JSON.parse. The well-formed equivalent is used here so the fixture proves a
  present-and-parsable product sequence resolves the price, while the malformed
  shape stays covered by tests/fixtures/mixed-ld.html.
-->
