<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>Soundcore Space One Wireless Headphones</title>
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <!-- Hand-trimmed Amazon DP page for a MIXED New & Used item (ASIN
       B0DWDDNK1Q, captured 2026-09-24). Faithful to the real served markup:
       NO og:/twitter: metas, NO JSON-LD, NO microdata — Amazon ships none.

       Shape A (accordion): TWO div[id^=corePrice] blocks, each wrapped in its
       own div[data-csa-c-buying-option-type] — NEW first (£34.97, the honest
       answer), USED second (£26.25). The ingress link below is the
       all-conditions summary: its href says condition=ALL and its .a-offscreen
       is the £26.25 floor, NOT the new price.

       Trap: an extractor that reads the first .a-offscreen inside
       #aod-ingress-link, or that ignores data-csa-c-buying-option-type,
       returns 2625 instead of 3497. The NEW row is sold by a third-party
       seller ("GadgetBay UK") — the condition, not the seller, is the filter.

       A trailing sponsored carousel (£21.99, another ASIN) guards the end-tag
       disarm for the mixed shape too. -->
  <div id="buyBoxAccordion" class="a-accordion">
    <div id="newAccordionRow_0" data-csa-c-buying-option-type="NEW" data-csa-c-slot-id="newAccordionRow_0" data-csa-c-content-id="corePrice" data-csa-c-is-in-initial-active-row="true">
      <div class="a-section">
        <span class="a-size-small">Sold by GadgetBay UK and Fulfilled by Amazon</span>
      </div>
      <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice" data-csa-c-asin="B0DWDDNK1Q">
        <div class="a-section apex-core-price-identifier">
          <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
            <span class="a-offscreen">£34.97</span>
            <span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">34<span class="a-price-decimal">.</span></span><span class="a-price-fraction">97</span></span>
          </span>
        </div>
      </div>
    </div>
    <div id="usedAccordionRow" data-csa-c-buying-option-type="USED" data-csa-c-slot-id="usedAccordionRow" data-csa-c-content-id="corePrice">
      <div class="a-section">
        <span class="a-size-small">Used: Very Good</span>
      </div>
      <div id="corePrice_feature_div" class="celwidget" data-feature-name="corePrice" data-csa-c-asin="B0DWDDNK1Q">
        <div class="a-section apex-core-price-identifier">
          <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
            <span class="a-offscreen">£26.25</span>
            <span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">26<span class="a-price-decimal">.</span></span><span class="a-price-fraction">25</span></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- All-offers ingress ("New & Used (34) from £26.25") — the ALL-conditions
       floor for the main ASIN, one penny-for-penny match to the USED block. -->
  <div class="a-section a-spacing-none daodi-content">
    <span class="a-declarative" data-action="show-all-offers-display" data-show-all-offers-display="{}">
      <a id="aod-ingress-link" aria-expanded="false" class="a-link-normal" href="/gp/offer-listing/B0DWDDNK1Q/ref=dp_olp_ALL_mbc?ie=UTF8&amp;condition=ALL" role="button">
        <span class="a-color-base">New &amp; Used (34) from</span>
        <span class="a-price" data-a-size="base_plus" data-a-color="base"><span class="a-offscreen">£26.25</span><span aria-hidden="true"><span class="a-price-symbol">£</span><span class="a-price-whole">26<span class="a-price-decimal">.</span></span><span class="a-price-fraction">25</span></span></span>
      </a>
    </span>
  </div>

  <!-- Main gallery image: data-old-hires carries the SL1500 hi-res variant. -->
  <div id="imageBlock" class="a-section">
    <img alt="Soundcore Space One Wireless Headphones" src="https://m.media-amazon.com/images/I/61K1QhKmzRL._AC_SY300_SX300_QL70_ML2_.jpg" data-mb-pv-slot-index="0" data-old-hires="https://m.media-amazon.com/images/I/61K1QhKmzRL._AC_SL1500_.jpg" data-a-image-name="landingImage" class="a-dynamic-image media-block-image-tag" id="landingImage" data-a-dynamic-image="{&quot;https://m.media-amazon.com/images/I/61K1QhKmzRL._AC_SY355_.jpg&quot;:[355,355],&quot;https://m.media-amazon.com/images/I/61K1QhKmzRL._AC_SY450_.jpg&quot;:[450,450]}" fetchpriority="high"/>
  </div>

  <!-- Trailing sponsored carousel (other ASIN) BELOW the buybox blocks: the
       buybox capture must already be closed by then. -->
  <div id="sp_detail" class="celwidget" data-csa-c-asin="B0OTHER011">
    <div class="a-row a-color-price">
      <a class="a-link-normal a-text-normal" href="/sspa/click?url=%2Fdp%2FB0OTHER011"><span class="a-price" data-a-size="medium_plus"><span class="a-offscreen">£21.99</span></span></a>
    </div>
  </div>
</body>
</html>
