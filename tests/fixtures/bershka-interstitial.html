<!DOCTYPE html>
<html>
<head>
<!-- Hand-trimmed capture of the Akamai Bot Manager interstitial served for an
     Inditex (Bershka) product URL on 2026-09-27: HTTP 200, 2,381 bytes, no
     redirect, 189-246ms. Trimmed to the shape the pipeline keys on. All four
     markers the detection table matches are present in the markup below and
     all sit inside the first 4,096 bytes, which is the sample window
     `detectBotWall` reads: the verify query parameter in the meta refresh, the
     /_sec/verify provider endpoint in the xhr, the challenge entry function,
     and the interstitial iframe resource.
     The 343-character live token and the live product path are replaced by
     synthetic values of the same shape. The meta-refresh target is deliberately
     LEFT RELATIVE, which is how the live body ships it and what a refetch must
     resolve against the fetched page URL.
     See docs/research/product-scraping.md. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="refresh" content="5; URL='/gb/example-product-c0p000000000.html?colorId=505&bm-verify=AAQAAAAO_____SYNTHETIC_TOKEN_FOR_TESTS__AAAA'">
<title>&nbsp;</title>
</head>
<body>
<noscript>
<iframe src="/interstitial/ic.html?provider=interstitial" height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>
<script type="text/javascript">
var i = "AAQAAAAO_____SYNTHETIC_TOKEN_FOR_TESTS__AAAA";
function triggerInterstitialChallenge() {
  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/_sec/verify?provider=interstitial", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.send(JSON.stringify({ bmVerify: i, error: "bm-verify" }));
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4 && xhr.status === 200) {
      var v = JSON.parse(xhr.responseText);
      if (v.reload) { location.reload(); }
      if (v.location) { location.href = v.location; }
    }
  };
}
window.addEventListener("load", function () { triggerInterstitialChallenge(); });
</script>
</body>
</html>
